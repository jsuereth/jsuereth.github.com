{% extends "base.html" %}

{% block title %}Categories &bull; {{ config.title }}{% endblock title %}

{% block content %}
<div>
  <h1>All Categories</h1>
  <ul style="list-style: none; padding: 0; display: flex; flex-wrap: wrap; gap: 0.75rem; margin-top: 1.5rem;">
    {% for term in terms %}
    <li>
      <a href="{{ term.permalink }}" class="social-pill" style="font-size: 0.95rem; padding: 0.4rem 1rem;">
        <strong>{{ term.name }}</strong>
        <span style="opacity: 0.6; margin-left: 0.25rem;">({{ term.pages | length }})</span>
      </a>
    </li>
    {% endfor %}
  </ul>
</div>
{% endblock content %}
